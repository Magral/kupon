name: Refresh public offers

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/collect_offers.py'
      - '.github/workflows/collect-offers.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scraper dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Collect public offers
        run: python scripts/collect_offers.py
      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add offers.json
          if git diff --cached --quiet; then
            echo "No feed changes"
          else
            git commit -m "Refresh public offer feed"
            git push
          fi

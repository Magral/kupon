name: Android APK release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK
        run: gradle --no-daemon assembleDebug
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Kupon-0.1.0.apk
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: Kupon 0.1.0
          target_commitish: main
          body: |
            Первый установочный выпуск приложения «Корзина выгоднее».

            Сравнение корзины с учётом цен, доставки, промокодов, минимальной суммы и совместимости скидок.
            Цены и предложения добавляются вручную; автоматический сбор каталогов магазинов будет добавлен позже.
          files: Kupon-0.1.0.apk
          fail_on_unmatched_files: true

name: Android APK release

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK
        run: gradle --no-daemon assembleDebug
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Kupon-0.2.1.apk
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.1
          name: Kupon 0.2.1
          target_commitish: main
          body: |
            Установочный выпуск приложения «Корзина выгоднее» версии 0.2.1.

            Сравнение корзины с доставкой и скидками, плюс обновляемая подборка публичных предложений из официальных страниц магазинов, купонных сайтов и сообщества.
            Каждый источник и уровень подтверждения показаны в приложении; перед заказом проверьте условия и код в корзине магазина.
          files: Kupon-0.2.1.apk
          fail_on_unmatched_files: true
